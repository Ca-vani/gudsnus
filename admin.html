<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | GUD SNUS</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<title>GUD SNUS | Premium Nicotine Pouches</title>

<meta name="description"
content="Premium Nicotine Pouches in Da Nang">

<link rel="icon" type="image/png" href="images/favicon.png">

<meta property="og:title" content="GUD SNUS">

<meta property="og:site_name" content="GUD SNUS">

<meta property="og:image"
content="https://snus.network/images/logo.png">

<meta property="og:type"
content="website">

<script type="application/ld+json">
{
 "@context":"https://schema.org",
 "@type":"Organization",
 "name":"GUD SNUS",
 "url":"https://snus.network",
 "logo":"https://snus.network/images/logo.png"
}
</script>

</head>

<body>

<header>

    <a href="index.html" class="logo">
    GUD <span>SNUS</span>
    </a>

    <nav>

        <a href="index.html">Home</a>

        <a href="products.html">Products</a>

        <a href="admin.html" class="active">Admin</a>

    </nav>

    <div class="header-right">

    <a href="cart.html" class="cart-icon">

        🛒

        <span id="cart-count">0</span>

    </a>

    <a href="login.html" id="admin-link" class="login-btn">

        👤 Login

    </a>

    <button id="logout-btn" class="logout-btn">

        Logout

    </button>

</div>

</header>


<section class="admin-dashboard">

<h1>Admin Dashboard</h1>

<div class="dashboard">

<div class="dashboard-card">

<h2 id="total-products">0</h2>

<p>Total Products</p>

</div>

<div class="dashboard-card">

<h2 id="total-brands">0</h2>

<p>Brands</p>

</div>

<div class="dashboard-card">

<h2 id="total-stock">0</h2>

<p>Total Stock</p>

</div>

<div class="dashboard-card">

<h2 id="total-value">0 đ</h2>

<p>Total Value</p>

</div>

</div>

</section>



<section class="admin">

<h2>Add Product</h2>

<div class="admin-form">

<input
id="name"
type="text"
placeholder="Product Name">

<select id="brand">

<option value="">Select Brand</option>

<option>VELO</option>

<option>ZYN</option>

<option>CUBA</option>

<option>KILLA</option>

<option>WHITE FOX</option>

<option>PABLO</option>

<option>SIBERIA</option>

</select>

<select id="strength">

<option value="">Strength</option>

<option>6MG</option>

<option>9MG</option>

<option>10MG</option>

<option>11MG</option>

<option>12MG</option>

<option>12.8MG</option>

<option>14MG</option>

<option>17MG</option>

<option>20MG</option>

<option>30MG</option>

<option>50MG</option>

</select>

<input
id="price"
type="number"
placeholder="Price">

<input
id="stock"
type="number"
placeholder="Stock">

<label class="upload-btn">
    📷 Choose Product Image
    <input
        type="file"
        id="image"
        accept="image/*"
        hidden>
</label>

<img
id="preview"
style="
display:none;
width:180px;
height:180px;
object-fit:contain;
background:#fff;
padding:10px;
border-radius:15px;
margin-top:15px;
">

<textarea
id="description"
placeholder="Description"></textarea>

<button
id="add-btn"
onclick="addProduct()">

➕ Add Product

</button>

</div>

</section>



<section class="product-manager">

<div class="manager-top">

<h2>Product Manager</h2>

<input
id="search"
type="text"
placeholder="🔍 Search Product..."
onkeyup="searchProducts()">

</div>

<div id="admin-products">

</div>

</section>

<script src="header.js"></script>

<div id="editModal" class="edit-modal">

<div class="edit-box">

<h2>Edit Product</h2>

<input id="edit-name" type="text" placeholder="Name">

<select id="edit-brand">

<option>VELO</option>
<option>ZYN</option>
<option>CUBA</option>
<option>KILLA</option>
<option>WHITE FOX</option>
<option>PABLO</option>
<option>SIBERIA</option>

</select>

<input id="edit-strength" type="text" placeholder="Strength">

<input id="edit-price" type="number" placeholder="Price">

<input id="edit-stock" type="number" placeholder="Stock">

<textarea
id="edit-description"
placeholder="Description"></textarea>

<input
type="file"
id="edit-image"
accept="image/*">

<img
id="edit-preview"
style="
display:none;
width:180px;
height:180px;
object-fit:contain;
background:#fff;
padding:10px;
border-radius:15px;
margin-top:15px;
">

<div class="edit-actions">

<button onclick="saveEdit()">

💾 Save

</button>

<button onclick="closeEdit()">

❌ Cancel

</button>

</div>

</div>

</div>

<script type="module" src="admin.js"></script>
<script src="menu.js"></script>

</body>

</html>
